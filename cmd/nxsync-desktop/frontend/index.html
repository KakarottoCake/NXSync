<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NXSync</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="brand">NX<span>Sync</span></div>
    <section>
      <div class="row">
        <span class="label">Eden saves</span>
        <span id="eden" class="value">Detecting…</span>
      </div>
      <div class="row">
        <span class="label">Status</span>
        <span id="status" class="pill idle">Idle</span>
      </div>
      <p id="detail"></p>
    </section>
    <button id="login">Connect Google Drive</button>
  </main>
  <script src="app.js"></script>
</body>
</html>
